# 테스트(ArchUnit 포함)·Spotless·Checkstyle을 모두 검사한다. 로컬의 ./gradlew check와 같다.
# DB 테스트는 Testcontainers가 러너의 Docker로 MySQL을 띄운다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 + 린트
        run: ./gradlew check --console=plain

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/
          retention-days: 7
