# 운영. 파일을 읽지 않으므로 .env.example에 있는 변수를 모두 배포 환경변수로 넣는다.
# 빠진 변수는 "${변수}"가 그대로 남아 시작에 실패한다
# (DB 접속이면 "Failed to parse the host:port pair", 숫자 설정이면 "Failed to bind properties").

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
